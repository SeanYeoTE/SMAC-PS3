# Cloud Build trigger: watch app/**, ps3/**, requirements.txt, Dockerfile,
# .dockerignore -- root include filters, since this repo keeps app/ and
# ps3/ at the root rather than under a backend/ subfolder.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/nebulax-containers/nebulax-api:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/nebulax-containers/nebulax-api:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - nebulax-api
      - --image
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/nebulax-containers/nebulax-api:$COMMIT_SHA
      - --region
      - asia-southeast1
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 2Gi

images:
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/nebulax-containers/nebulax-api:$COMMIT_SHA
